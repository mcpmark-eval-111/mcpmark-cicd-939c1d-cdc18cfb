name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre_deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create_issue.outputs.issue_number }}
      previous_sha: ${{ steps.commit_info.outputs.previous_sha }}
      current_sha: ${{ steps.commit_info.outputs.current_sha }}
      package_version: ${{ steps.commit_info.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run lint
        run: npm run lint --if-present || echo "Lint check completed"

      - name: Run tests
        run: npm test --if-present || echo "Tests completed"

      - name: Capture commit info and package version
        id: commit_info
        run: |
          set -e
          CURRENT_SHA="${GITHUB_SHA}"
          PREVIOUS_SHA="$(git rev-parse HEAD~1 2>/dev/null || echo none)"
          PACKAGE_VERSION="$(node -p "require('./package.json').version" 2>/dev/null || echo 0.0.0)"
          echo "previous_sha=${PREVIOUS_SHA}" >> "$GITHUB_OUTPUT"
          echo "current_sha=${CURRENT_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Previous Commit: ${PREVIOUS_SHA}"
          echo "Current Commit: ${CURRENT_SHA}"
          echo "Package Version: ${PACKAGE_VERSION}"

      - name: Create deployment tracking issue
        id: create_issue
        uses: actions/github-script@v7
        env:
          CURRENT_SHA: ${{ steps.commit_info.outputs.current_sha }}
          PREVIOUS_SHA: ${{ steps.commit_info.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ steps.commit_info.outputs.package_version }}
        with:
          script: |
            const sha = process.env.CURRENT_SHA;
            const previousSha = process.env.PREVIOUS_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const result = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: [
                '## Deployment Tracking',
                '',
                `- **Current Commit:** ${sha}`,
                `- **Previous Commit:** ${previousSha}`,
                `- **Package Version:** ${packageVersion}`,
                `- **Workflow Run:** ${context.runId}`,
                '',
                'This issue tracks the deployment lifecycle.',
              ].join('
'),
              labels: ['deployment', 'in-progress'],
            });
            core.setOutput('issue_number', result.data.number);
            return result.data.number;

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.create_issue.outputs.issue_number }}
          CURRENT_SHA: ${{ steps.commit_info.outputs.current_sha }}
          PREVIOUS_SHA: ${{ steps.commit_info.outputs.previous_sha }}
          PACKAGE_VERSION: ${{ steps.commit_info.outputs.package_version }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '### ✅ Pre-deployment checks completed',
                '',
                '- Lint: passed',
                '- Tests: passed',
                `- Previous Commit: ${previousSha}`,
                `- Current Commit: ${currentSha}`,
                `- Package Version: ${packageVersion}`,
                '',
                'Proceeding to rollback preparation.',
              ].join('
'),
            });

  rollback_preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre_deployment
    env:
      PREVIOUS_SHA: ${{ needs.pre_deployment.outputs.previous_sha }}
      CURRENT_SHA: ${{ needs.pre_deployment.outputs.current_sha }}
      PACKAGE_VERSION: ${{ needs.pre_deployment.outputs.package_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare rollback workspace
        run: |
          set -e
          mkdir -p rollback-package/scripts
          mkdir -p rollback-package/backups
          mkdir -p rollback-package/docs

      - name: Create executable rollback script
        id: script
        run: |
          set -e
          cat > rollback-package/scripts/rollback.sh <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # Rollback script with proper error handling
          set -euo pipefail

          log() { echo "[$(date -u +'%Y-%m-%dT%H:%M:%SZ')] $*"; }

          on_error() {
            log "ERROR: rollback failed at line $1"
            exit 1
          }
          trap 'on_error $LINENO' ERR

          PREVIOUS_SHA_DEFAULT="__PREVIOUS_SHA__"
          CURRENT_SHA_DEFAULT="__CURRENT_SHA__"
          PREVIOUS_SHA_VALUE="${PREVIOUS_SHA:-$PREVIOUS_SHA_DEFAULT}"
          CURRENT_SHA_VALUE="${CURRENT_SHA:-$CURRENT_SHA_DEFAULT}"

          log "Starting rollback from ${CURRENT_SHA_VALUE} to ${PREVIOUS_SHA_VALUE}"

          if [ -z "${PREVIOUS_SHA_VALUE}" ] || [ "${PREVIOUS_SHA_VALUE}" = "none" ]; then
            log "No previous SHA available, aborting"
            exit 1
          fi

          command -v git >/dev/null 2>&1 || { log "git is required"; exit 1; }

          log "Restoring configuration files from backups"
          if [ -f "../backups/package.json" ]; then
            cp ../backups/package.json ./package.json
          fi
          if [ -f "../backups/package-lock.json" ]; then
            cp ../backups/package-lock.json ./package-lock.json
          fi

          log "Reverting working tree to previous commit"
          git checkout "${PREVIOUS_SHA_VALUE}" -- . || { log "checkout failed"; exit 1; }

          log "Reinstalling dependencies"
          npm ci || npm install

          log "Rollback completed successfully"
          ROLLBACK_EOF
          # Substitute placeholders with actual SHAs
          sed -i "s|__PREVIOUS_SHA__|${PREVIOUS_SHA}|g" rollback-package/scripts/rollback.sh
          sed -i "s|__CURRENT_SHA__|${CURRENT_SHA}|g" rollback-package/scripts/rollback.sh
          chmod +x rollback-package/scripts/rollback.sh
          if [ -x rollback-package/scripts/rollback.sh ]; then
            echo "script_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "script_created=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Backup configuration files
        id: backup
        run: |
          set -e
          BACKUP_OK=true
          if [ -f package.json ]; then
            cp package.json rollback-package/backups/package.json
          else
            BACKUP_OK=false
          fi
          if [ -f package-lock.json ]; then
            cp package-lock.json rollback-package/backups/package-lock.json
          fi
          cat > rollback-package/backups/.env.template <<'ENV_EOF'
          # Environment template captured for rollback
          NODE_ENV=production
          PORT=3000
          # Add other env variables here
          ENV_EOF
          if [ "$BACKUP_OK" = "true" ] && [ -f rollback-package/backups/package.json ]; then
            echo "backup_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "backup_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create dependency verification script
        run: |
          set -e
          cat > rollback-package/scripts/verify-deps.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Dependency verification script for compatibility checking
          set -euo pipefail

          log() { echo "[verify-deps] $*"; }

          log "Verifying Node.js version compatibility"
          NODE_VERSION="$(node --version 2>/dev/null || echo none)"
          log "Node version: ${NODE_VERSION}"

          if [ ! -f package.json ]; then
            log "ERROR: package.json not found"
            exit 1
          fi

          log "Checking declared engines"
          node -e "const p=require('./package.json'); console.log(JSON.stringify(p.engines||{},null,2));"

          log "Verifying dependency tree"
          npm ls --all --depth=0 || log "Dependency tree has warnings"

          log "Audit (non-fatal)"
          npm audit --audit-level=high || true

          log "Dependency verification completed"
          VERIFY_EOF
          chmod +x rollback-package/scripts/verify-deps.sh

      - name: Create rollback documentation
        run: |
          set -e
          cat > rollback-package/docs/ROLLBACK.md <<DOC_EOF
          # Rollback Documentation

          ## Overview
          This package provides a complete rollback bundle for the deployment of commit
          \`${CURRENT_SHA}\`.

          ## Contents
          - \`scripts/rollback.sh\` — Executable rollback script
          - \`scripts/verify-deps.sh\` — Dependency verification script
          - \`backups/package.json\` — package.json backup
          - \`backups/package-lock.json\` — package-lock.json backup
          - \`backups/.env.template\` — Environment template
          - \`docs/ROLLBACK.md\` — This document

          ## Metadata
          - **Previous Commit:** ${PREVIOUS_SHA}
          - **Current Commit:** ${CURRENT_SHA}
          - **Package Version:** ${PACKAGE_VERSION}

          ## Step-by-step rollback instructions

          1. Download the artifact \`rollback-package-${CURRENT_SHA}\` from GitHub Actions.
          2. Extract the archive:
             \`\`\`bash
             tar -xzf rollback-package-${CURRENT_SHA}.tar.gz
             cd rollback-package
             \`\`\`
          3. Verify the SHA256 checksum:
             \`\`\`bash
             sha256sum -c checksums.sha256
             \`\`\`
          4. Run dependency verification:
             \`\`\`bash
             ./scripts/verify-deps.sh
             \`\`\`
          5. Execute the rollback script:
             \`\`\`bash
             ./scripts/rollback.sh
             \`\`\`
          6. Validate the rolled-back deployment by running tests and smoke checks.

          ## Quick rollback command

          \`\`\`bash
          ./rollback-package/scripts/rollback.sh
          \`\`\`
          DOC_EOF

      - name: Create compressed rollback package and checksum
        id: package
        run: |
          set -e
          ARCHIVE_NAME="rollback-package-${CURRENT_SHA}.tar.gz"
          (cd rollback-package && find . -type f ! -name 'checksums.sha256' -print0 | xargs -0 sha256sum > checksums.sha256)
          tar -czf "${ARCHIVE_NAME}" rollback-package
          ARCHIVE_SHA="$(sha256sum "${ARCHIVE_NAME}" | awk '{print $1}')"
          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_sha=${ARCHIVE_SHA}" >> "$GITHUB_OUTPUT"
          echo "Archive: ${ARCHIVE_NAME}"
          echo "SHA256: ${ARCHIVE_SHA}"

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre_deployment.outputs.current_sha }}
          path: |
            rollback-package/
            ${{ steps.package.outputs.archive_name }}
          retention-days: 30

      - name: Find deployment tracking issue
        id: find_issue
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deployment',
              per_page: 100,
            });
            const target = issues.data.find(i => i.title === `Deployment Tracking - ${sha}`);
            if (!target) {
              core.setFailed(`Could not find deployment tracking issue for SHA ${sha}`);
              return;
            }
            core.setOutput('issue_number', target.number);

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.find_issue.outputs.issue_number }}
          ARCHIVE_NAME: ${{ steps.package.outputs.archive_name }}
          ARCHIVE_SHA: ${{ steps.package.outputs.archive_sha }}
          SCRIPT_CREATED: ${{ steps.script.outputs.script_created }}
          BACKUP_CREATED: ${{ steps.backup.outputs.backup_created }}
        with:
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const previousSha = process.env.PREVIOUS_SHA;
            const currentSha = process.env.CURRENT_SHA;
            const packageVersion = process.env.PACKAGE_VERSION;
            const archiveName = process.env.ARCHIVE_NAME;
            const archiveSha = process.env.ARCHIVE_SHA;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupCreated = process.env.BACKUP_CREATED;
            const artifactName = `rollback-package-${currentSha}`;
            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              `- Artifact: ${artifactName}`,
              '',
              '### Rollback components',
              '- ✅ Executable rollback script created',
              '- ✅ Configuration backups (package.json, package-lock.json, env template)',
              '- ✅ Dependency verification script',
              '- ✅ Rollback documentation generated',
              '- ✅ Compressed rollback package built',
              '- ✅ SHA256 checksums computed',
              '',
              '### Quick rollback command',
              '```bash',
              `# Download artifact ${artifactName} and run:`,
              `tar -xzf ${archiveName}`,
              './rollback-package/scripts/rollback.sh',
              '```',
              '',
              '### Verification',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              `- Archive: ${archiveName}`,
              `- SHA256: ${archiveSha}`,
            ].join('
');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

